
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Mario Game</title>
</head>
<body>
    <!-- Aviso de Orientação -->
    <div id="orientationWarning" class="orientation-warning">
        <p>🔄 Gire o dispositivo para Paisagem</p>
    </div>

    <div class="game-board day" id="gameBoard">
        <img src="./img/mario.gif" class="mario" />
        <img src="./img/pipe.png" class="pipe" />
        <img src="./img/clouds.png" class="clouds" />

        <div class="score-board">
            <h2>Fase: <span id="fase">1</span></h2>
            <h2>Pontos: <span id="pontos">0</span></h2>
        </div>

        <!-- Área de Toque para Mobile -->
        <div id="touchArea" class="touch-area"></div>

        <!-- Botão de Reinício -->
        <button id="restartButton" class="restart-button">Reiniciar</button>
    </div>
</body>
</html>
